name: Publish selected demonstrator interfaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser-test dependencies
        run: npm ci --ignore-scripts
      - name: Validate calculations and selected publication
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_site_publication.py'
      - name: Build selected public files
        run: python scripts/build_site.py
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Check the built Decision tree in the browser
        env:
          EFLOW_BASE_URL: http://127.0.0.1:8769
        run: |
          python -m http.server 8769 --bind 127.0.0.1 --directory _site > /tmp/eflow-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail --silent --output /dev/null "$EFLOW_BASE_URL/prototype/"
          npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy selected site
        id: deployment
        uses: actions/deploy-pages@v4
